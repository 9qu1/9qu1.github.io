<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <!-- Twitterダウンローダーのカード背景: タイムラインの写真と動画に「保存」ボタン、広告の投稿は隠す、左に保存されたファイル -->
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4cb3ff"/>
      <stop offset="1" stop-color="#1d8fe8"/>
    </linearGradient>
    <linearGradient id="photo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#ff9a6b"/>
    </linearGradient>
  </defs>

  <g transform="translate(200 0)">
  <!-- タイムラインの列 -->
  <rect x="60" y="20" width="330" height="380" rx="20" fill="#2a303c"/>

  <!-- 投稿1: 写真つき -->
  <circle cx="92" cy="58" r="16" fill="#8b93a5"/>
  <rect x="116" y="48" width="80" height="9" rx="4.5" fill="#ffffff" opacity="0.85"/>
  <rect x="204" y="48" width="50" height="9" rx="4.5" fill="#8b93a5"/>
  <rect x="116" y="66" width="230" height="8" rx="4" fill="#8b93a5" opacity="0.8"/>
  <rect x="116" y="86" width="250" height="120" rx="14" fill="url(#photo)"/>
  <circle cx="320" cy="116" r="16" fill="#fff4d6"/>
  <path d="M116 180 L176 130 L226 170 L262 146 L366 206 H130 a14 14 0 0 1 -14 -14 Z" fill="#e0775a"/>
  <!-- 写真の保存ボタン -->
  <rect x="290" y="96" width="66" height="26" rx="13" fill="url(#blue)"/>
  <path d="M305 102 v10 m-5 -5 l5 5 l5 -5 M299 117 h12" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="318" y="105" width="28" height="8" rx="4" fill="#fff"/>

  <!-- 投稿2: 広告(隠す) -->
  <g opacity="0.45">
    <rect x="80" y="222" width="290" height="44" rx="10" fill="#3b4252"/>
    <rect x="96" y="236" width="40" height="16" rx="8" fill="#8b93a5"/>
    <rect x="146" y="240" width="150" height="8" rx="4" fill="#8b93a5"/>
  </g>
  <path d="M326 232 c10 -8 26 -8 36 0 c-10 8 -26 8 -36 0 Z" stroke="#ff6b5e" stroke-width="3" transform="translate(-6 12)"/>
  <path d="M318 256 L358 232" stroke="#ff6b5e" stroke-width="3.5" stroke-linecap="round"/>

  <!-- 投稿3: 動画つき -->
  <circle cx="92" cy="296" r="16" fill="#8b93a5"/>
  <rect x="116" y="286" width="70" height="9" rx="4.5" fill="#ffffff" opacity="0.85"/>
  <rect x="116" y="304" width="200" height="8" rx="4" fill="#8b93a5" opacity="0.8"/>
  <rect x="116" y="322" width="250" height="70" rx="14" fill="#1f2430"/>
  <circle cx="241" cy="357" r="20" fill="#ffffff" opacity="0.9"/>
  <path d="M235 346 L252 357 L235 368 Z" fill="#1f2430"/>
  <!-- 動画の保存ボタン -->
  <rect x="278" y="330" width="80" height="26" rx="13" fill="url(#blue)"/>
  <path d="M293 336 v10 m-5 -5 l5 5 l5 -5 M287 351 h12" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="306" y="339" width="42" height="8" rx="4" fill="#fff"/>

  </g>

  <!-- 保存されたファイル(写真と動画) -->
  <g transform="translate(40 70) rotate(-5)">
    <path d="M0 12 a12 12 0 0 1 12 -12 h58 l26 26 v92 a12 12 0 0 1 -12 12 h-72 a12 12 0 0 1 -12 -12 Z" fill="#ffffff"/>
    <path d="M70 0 v18 a8 8 0 0 0 8 8 h18" fill="#dfe3ea"/>
    <rect x="14" y="40" width="68" height="48" rx="8" fill="url(#photo)"/>
    <path d="M14 80 L38 60 L56 74 L68 66 L82 78 V80 a8 8 0 0 1 -8 8 H22 a8 8 0 0 1 -8 -8 Z" fill="#e0775a"/>
    <rect x="14" y="100" width="44" height="9" rx="4.5" fill="#9aa3b5"/>
  </g>
  <g transform="translate(70 230) rotate(6)">
    <path d="M0 12 a12 12 0 0 1 12 -12 h58 l26 26 v92 a12 12 0 0 1 -12 12 h-72 a12 12 0 0 1 -12 -12 Z" fill="#ffffff"/>
    <path d="M70 0 v18 a8 8 0 0 0 8 8 h18" fill="#dfe3ea"/>
    <rect x="14" y="40" width="68" height="48" rx="8" fill="#2a303c"/>
    <path d="M14 80 L36 64 L52 76 L64 68 L82 80 a8 8 0 0 1 -8 8 H22 a8 8 0 0 1 -8 -8 Z" fill="#4c566a"/>
    <circle cx="48" cy="58" r="11" fill="#ffffff" opacity="0.9"/>
    <path d="M45 52.5 L54 58 L45 63.5 Z" fill="#2a303c"/>
    <rect x="14" y="100" width="44" height="9" rx="4.5" fill="#9aa3b5"/>
    <circle cx="88" cy="118" r="18" fill="#22c55e"/>
    <path d="M79 118 l6 6 l12 -12" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
