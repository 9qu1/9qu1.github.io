<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <!-- YouTubeダウンローダーのカード背景: 動画プレーヤーに「保存」ボタンと画質メニュー、下に進み具合と保存されたファイル -->
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b4252"/>
      <stop offset="1" stop-color="#1f2430"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5a4d"/>
      <stop offset="1" stop-color="#e02020"/>
    </linearGradient>
  </defs>

  <!-- ブラウザの窓 -->
  <rect x="40" y="36" width="440" height="300" rx="18" fill="#2a303c"/>
  <circle cx="66" cy="58" r="6" fill="#ff6b5e"/>
  <circle cx="86" cy="58" r="6" fill="#ffbd3e"/>
  <circle cx="106" cy="58" r="6" fill="#27c93f"/>
  <rect x="130" y="50" width="200" height="16" rx="8" fill="#3b4252"/>

  <!-- プレーヤー -->
  <rect x="58" y="80" width="404" height="236" rx="12" fill="url(#screen)"/>
  <path d="M58 250 L150 190 L220 235 L300 170 L462 262 V304 a12 12 0 0 1 -12 12 H70 a12 12 0 0 1 -12 -12 Z" fill="#4c566a" opacity="0.6"/>
  <circle cx="220" cy="190" r="36" fill="#ffffff" opacity="0.92"/>
  <path d="M210 172 L238 190 L210 208 Z" fill="#1f2430"/>
  <!-- 再生バー -->
  <rect x="78" y="292" width="364" height="6" rx="3" fill="#ffffff" opacity="0.25"/>
  <rect x="78" y="292" width="150" height="6" rx="3" fill="url(#red)"/>
  <circle cx="228" cy="295" r="7" fill="#ff5a4d"/>

  <!-- 保存ボタン(右上) -->
  <rect x="330" y="96" width="118" height="34" rx="17" fill="url(#red)"/>
  <path d="M352 104 v14 m-6 -6 l6 6 l6 -6 M345 123 h14" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="368" y="108" width="40" height="10" rx="5" fill="#fff" opacity="0.95"/>
  <path d="M424 108 l6 6 l6 -6" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 画質メニュー -->
  <rect x="300" y="138" width="200" height="176" rx="14" fill="#15181f"/>
  <g fill="#ffffff">
    <rect x="318" y="156" width="54" height="10" rx="5"/>
    <rect x="318" y="188" width="54" height="10" rx="5" opacity="0.85"/>
    <rect x="318" y="220" width="36" height="10" rx="5" opacity="0.85"/>
    <rect x="318" y="252" width="54" height="10" rx="5" opacity="0.85"/>
    <rect x="318" y="284" width="54" height="10" rx="5" opacity="0.85"/>
  </g>
  <g fill="#8b93a5">
    <rect x="410" y="157" width="62" height="8" rx="4"/>
    <rect x="420" y="189" width="52" height="8" rx="4"/>
    <rect x="420" y="221" width="52" height="8" rx="4"/>
    <rect x="446" y="253" width="26" height="8" rx="4"/>
    <rect x="446" y="285" width="26" height="8" rx="4"/>
  </g>
  <path d="M486 155 l2.5 5 5.5 .8 -4 3.9 1 5.5 -5 -2.6 -5 2.6 1 -5.5 -4 -3.9 5.5 -.8 Z" fill="#ffc531"/>
  <rect x="306" y="144" width="188" height="34" rx="9" fill="#ffffff" opacity="0.08"/>

  <!-- 進み具合 -->
  <rect x="90" y="350" width="300" height="36" rx="18" fill="#2a303c"/>
  <rect x="106" y="364" width="190" height="8" rx="4" fill="#ffffff" opacity="0.2"/>
  <rect x="106" y="364" width="120" height="8" rx="4" fill="url(#red)"/>
  <rect x="312" y="363" width="60" height="10" rx="5" fill="#ffffff" opacity="0.7"/>

  <!-- 保存されたファイル -->
  <g transform="translate(470 250) rotate(6)">
    <path d="M0 12 a12 12 0 0 1 12 -12 h58 l26 26 v92 a12 12 0 0 1 -12 12 h-72 a12 12 0 0 1 -12 -12 Z" fill="#ffffff"/>
    <path d="M70 0 v18 a8 8 0 0 0 8 8 h18" fill="#dfe3ea"/>
    <rect x="14" y="40" width="68" height="48" rx="8" fill="#2a303c"/>
    <path d="M14 80 L36 64 L52 76 L64 68 L82 80 a8 8 0 0 1 -8 8 H22 a8 8 0 0 1 -8 -8 Z" fill="#4c566a"/>
    <circle cx="48" cy="58" r="11" fill="#ffffff" opacity="0.9"/>
    <path d="M45 52.5 L54 58 L45 63.5 Z" fill="#2a303c"/>
    <rect x="14" y="100" width="44" height="9" rx="4.5" fill="#9aa3b5"/>
    <circle cx="88" cy="118" r="18" fill="#22c55e"/>
    <path d="M79 118 l6 6 l12 -12" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
